<section class="flex-1 bg-papi-gray/10 flex flex-col p-4 md:p-8 overflow-hidden relative">
  <!-- Top Navigation Bar -->
  <div class="w-full flex justify-between items-center md:hidden mb-4 shrink-0">
    <button (click)="closed.emit()" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white hover:border-papi-gold/50 transition-all shrink-0 backdrop-blur-md">
      <mat-icon class="text-[18px]">arrow_back</mat-icon>
    </button>
    <button (click)="closed.emit()" class="circle-btn md:hidden ml-auto">
      <mat-icon class="text-[18px]">close</mat-icon>
    </button>
  </div>

  <div class="hidden md:flex justify-end mb-4 shrink-0 w-full">
     <button (click)="closed.emit()" class="circle-btn">
        <mat-icon class="text-[18px]">close</mat-icon>
      </button>
  </div>

  <!-- Detail Header (Minimalistic as requested) -->
  <div class="flex flex-col items-center md:items-start text-center md:text-left min-w-0 shrink-0 slide-in-from-top-4 duration-[800ms] ease-out animate-in fade-in relative z-10 w-full mb-6">
    @let c = customer();

    <!-- Luxurious Avatar -->
    <div class="mx-auto md:mx-0 w-24 h-24 md:w-[100px] md:h-[100px] rounded-full border border-papi-gold/20 p-[2px] mb-4 shadow-[0_0_30px_rgba(216,181,137,0.1)]">
      <div class="w-full h-full bg-[#0d0d0e] rounded-full flex items-center justify-center text-papi-gold text-[2.5rem] font-light font-display">
        {{ getInitials(c) }}
      </div>
    </div>
    
    <h1 class="text-[2rem] md:text-[2.5rem] font-display text-white truncate tracking-tight w-full">{{ c.name }} <span class="font-normal">{{ c.lastName }}</span></h1>
    
    <div class="h-[1px] w-12 bg-papi-gold/30 my-3 mx-auto md:mx-0"></div>
    
    <div class="flex flex-col md:flex-row items-center md:items-start gap-2 md:gap-6 text-[14px] font-light text-white/60">
      <span class="flex items-center gap-2 hover:text-white transition-colors cursor-pointer">
        <mat-icon class="text-[18px] text-papi-gold">phone_iphone</mat-icon> {{ c.phone }}
      </span>
      @if (c.email) {
        <span class="flex items-center gap-2 truncate hover:text-white transition-colors cursor-pointer">
          <mat-icon class="text-[18px] text-papi-gold shrink-0">mail</mat-icon> <span class="truncate">{{ c.email }}</span>
        </span>
      } @else {
        <span class="flex items-center gap-2 opacity-50 italic text-sm">
          <mat-icon class="text-[18px]">mail</mat-icon> Bez e-mailu
        </span>
      }
    </div>
  </div>

  <!-- Note taking area (from roughly 50vh down) -->
  <div class="flex-1 flex flex-col min-h-[50vh] border-t border-white/5 pt-6 w-full animate-in fade-in slide-in-from-bottom-8 duration-700">
     <div class="flex items-center justify-between mb-3 shrink-0">
        <label class="text-[11px] text-papi-gold opacity-80 uppercase tracking-widest font-semibold flex items-center gap-2">
            <mat-icon class="text-[16px]">edit_note</mat-icon> Interná poznámka klienta
        </label>
        
        <!-- Status indicator for saving if needed, keeping it simple -->
     </div>
     
     <!-- Massive Textarea -->
     <textarea 
      [(ngModel)]="editNotes"
      class="flex-1 w-full bg-[#111112]/80 border border-white/10 rounded-2xl p-5 text-white/90 focus:outline-none focus:border-papi-gold/50 focus:ring-1 focus:ring-papi-gold/20 transition-all font-sans text-[15px] leading-relaxed custom-scrollbar resize-none backdrop-blur-md shadow-inner"
      placeholder="Miesto pre dôležité záznamy, preferencie, typ farby alebo iné poznámky..."></textarea>
      
     <button (click)="saveChanges()" class="mt-4 shrink-0 w-full bg-gradient-to-r from-[#D8B589] to-[#EFDBC2] hover:opacity-90 text-black font-semibold tracking-wide py-4 md:py-5 rounded-2xl transition-all shadow-[0_4px_20px_rgba(216,181,137,0.2)] flex items-center justify-center gap-2 active:scale-[0.98]">
       <mat-icon class="text-[20px]">save</mat-icon> ULOŽIŤ DO SYSTÉMU
     </button>
  </div>
</section>
